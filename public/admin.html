<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masti Masti – Admin Panel</title>
    <style>
        body {
          margin: 0;
          font-family: 'Segoe UI', Roboto, sans-serif;
          background: #f7f3e9;
        }
        .login-container {
          max-width: 400px;
          margin: 100px auto;
          background: white;
          padding: 30px;
          border-radius: 28px;
          box-shadow: 0 8px 20px rgba(0,0,0,0.1);
          text-align: center;
        }
        h1 { color: #d84627; }
        input, button {
          width: 100%;
          padding: 12px;
          margin: 8px 0;
          border-radius: 40px;
          border: 1px solid #ddd;
          font-size: 16px;
        }
        button {
          background: #d84627;
          color: white;
          border: none;
          cursor: pointer;
          font-weight: bold;
        }
        button:hover { background: #b03a1f; }
        .error { color: red; margin-top: 10px; }
        iframe {
          width: 100%;
          height: 100vh;
          border: none;
        }
        .logout-bar {
          background: white;
          padding: 10px 20px;
          text-align: right;
          border-bottom: 1px solid #e2d5c0;
        }
        .logout-bar button {
          width: auto;
          padding: 6px 16px;
          margin: 0;
        }
    </style>
</head>
<body>
<div id="loginWrapper">
    <div class="login-container">
        <h1>🔐 Admin Access</h1>
        <p>Enter your secure password to manage stockist applications</p>
        <input type="password" id="adminPassword" placeholder="Admin password">
        <button onclick="login()">Login to Dashboard</button>
        <div id="errorMsg" class="error"></div>
    </div>
</div>
<div id="dashboardWrapper" style="display: none;">
    <div class="logout-bar">
        <button onclick="logout()">Logout</button>
    </div>
    <iframe id="adminIframe" src="about:blank"></iframe>
</div>

<script>
    // === CHANGE THIS TO THE PASSWORD YOU WANT TO USE FOR THE VERCEL PAGE ===
    const VERCEL_ADMIN_PASSWORD = "your-vercel-password";

    // === YOUR APPS SCRIPT ADMIN URL (WITH THE APPS SCRIPT PASSWORD) ===
    // Replace with your actual Apps Script URL and the password you set in the script
    const APPS_SCRIPT_ADMIN_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec?page=admin&pass=YOUR_APPS_SCRIPT_PASSWORD";

    function login() {
      const entered = document.getElementById('adminPassword').value;
      if (entered !== VERCEL_ADMIN_PASSWORD) {
        document.getElementById('errorMsg').innerText = 'Wrong password';
        return;
      }
      document.getElementById('loginWrapper').style.display = 'none';
      document.getElementById('dashboardWrapper').style.display = 'block';
      document.getElementById('adminIframe').src = APPS_SCRIPT_ADMIN_URL;
    }

    function logout() {
      document.getElementById('loginWrapper').style.display = 'block';
      document.getElementById('dashboardWrapper').style.display = 'none';
      document.getElementById('adminIframe').src = 'about:blank';
      document.getElementById('adminPassword').value = '';
    }
</script>
</body>
</html>
